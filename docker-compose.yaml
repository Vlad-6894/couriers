services:

  auth:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/auth
    container_name: auth-service
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=couriers-postgres-db
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "5050:5050"

  orders:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/orders
    container_name: orders-service
    environment:
      - HTTP_ADDR=:5051
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=couriers-postgres-db
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
      - KAFKA_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_TOPIC=${KAFKA_PRODUCER_ORDERS_TOPIC}
      - KAFKA_NUM_PARTITIONS=${KAFKA_NUM_PARTITIONS}
      - KAFKA_CREATE_TIME=${KAFKA_CREATE_TIME}
      - KAFKA_PRODUCER_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_PRODUCER_TOPIC=${KAFKA_PRODUCER_ORDERS_TOPIC}
      - KAFKA_PRODUCER_MAX_ATTEMPTS=${KAFKA_MAX_ATTEMPTS}
      - KAFKA_PRODUCER_WRITE_TIMEOUT=${KAFKA_WRITE_TIMEOUT}
      - KAFKA_PRODUCER_READ_TIMEOUT=${KAFKA_READ_TIMEOUT}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "5051:5051"

    dispetch:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/dispetch
    container_name: dispetch-service
    environment:
      - POSTGRES_HOST=couriers-postgres-db
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=couriers-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_TIMEOUT}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
      - KAFKA_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_NUM_PARTITIONS=${KAFKA_NUM_PARTITIONS}
      - KAFKA_CREATE_TIME=${KAFKA_CREATE_TIME}
      - KAFKA_CONSUMER_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_TOPIC=${KAFKA_PRODUCER_ORDERS_TOPIC}
      - KAFKA_MAX_ATTEMPTS=${KAFKA_MAX_ATTEMPTS}
      - KAFKA_WRITE_TIMEOUT=${KAFKA_WRITE_TIMEOUT}
      - KAFKA_READ_TIMEOUT=${KAFKA_READ_TIMEOUT}
      - KAFKA_ORDERS_DISPETCHED_TOPIC=${KAFKA_PRODUCER_ORDERS_DISPETCHED_TOPIC}
      - KAFKA_CONSUMER_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_CONSUMER_ORDERS_TOPIC=${KAFKA_PRODUCER_ORDERS_TOPIC}
      - KAFKA_CONSUMER_CONFIRM_TOPIC=${CONFIRM_TOPIC}
      - KAFKA_CONSUMER_ORDERS_GROUP_ID=${KAFKA_DISPETCH_CONSUMER_ORDERS_GROUP_ID}
      - KAFKA_CONSUMER_CONFIRM_GROUP_ID=${KAFKA_DISPETCH_CONSUMER_CONFIRM_GROUP_ID}
      - KAFKA_CONSUMER_COMMIT_INTERVAL=${KAFKA_COMMIT_INTERVAL}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs

    couriers:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/couriers
    container_name: couriers-service
    environment:
      - HTTP_ADDR=:5052
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - REDIS_HOST=couriers-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_TIMEOUT}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
      - KAFKA_PRODUCER_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_PRODUCER_TOPIC=${CONFIRM_TOPIC}
      - KAFKA_PRODUCER_MAX_ATTEMPTS=${KAFKA_MAX_ATTEMPTS}
      - KAFKA_PRODUCER_WRITE_TIMEOUT=${KAFKA_WRITE_TIMEOUT}
      - KAFKA_PRODUCER_READ_TIMEOUT=${KAFKA_READ_TIMEOUT}
      - KAFKA_CONSUMER_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_CONSUMER_ORDERS_TOPIC=${KAFKA_PRODUCER_ORDERS_DISPETCHED_TOPIC}
      - KAFKA_CONSUMER_ORDERS_GROUP_ID=${KAFKA_COURIERS_CONSUMER_ORDERS_GROUP_ID}
      - KAFKA_CONSUMER_COMMIT_INTERVAL=${KAFKA_COMMIT_INTERVAL}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "5052:5052"

  couriers-postgres-db:
    image: postgres:18.1-bookworm
    container_name: postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pg_data:/var/lib/postgresql:z
    restart: always
  
  couriers-postgres-db-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  couriers-postgres-port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:couriers-postgres-db
    ports:
      - "127.0.0.1:5432:5432"
    
  couriers-redis:
    image: redis:8.6.1
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/redis_data:/data
    restart: always
  
  couriers-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka_kraft:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'